[lib]
proc-macro = true

[package]
name = "method_name_proc_macro"
version = "0.3.4"                                                                # Keep in sync
authors = ["ssrlive", "Daniel Henry-Mantilla <daniel.henry.mantilla@gmail.com>"]
edition = "2024"

description = "macro that expands to the name of the annotated function"
documentation = "https://docs.rs/method_name"
homepage = "https://crates.io/crates/method_name"
repository = "https://github.com/ssrlive/method_name"
keywords = [
    "macro",
    "proc-macro",
    "proc-macro-attribute",
    "name",
    "method_name",
]

license = "MIT"
