[package]
name = "method_name"
version = "0.3.1"                                                     # Keep in sync
authors = ["Daniel Henry-Mantilla <daniel.henry.mantilla@gmail.com>"]
edition = "2024"

description = "macro that expands to the name of the annotated function"
documentation = "https://docs.rs/method_name"
homepage = "https://crates.io/crates/method_name"
repository = "https://github.com/ssrlive/method_name"
keywords = [
    "macro",
    "proc-macro",
    "proc-macro-attribute",
    "name",
    "method_name",
]

readme = "README.md"
license = "MIT"

[dependencies.method_name_proc_macro]
version = "0.3.1"   # Keep in sync
path = "proc-macro"

[features]
# default = ["docs-rs"]
docs-rs = ["better-docs"]
better-docs = []

[workspace]
members = ["proc-macro"]

[package.metadata.docs.rs]
features = ["docs-rs"]
