[package]
name = "method_name"
version = "0.3.3"                                                                # Keep in sync
authors = ["ssrlive", "Daniel Henry-Mantilla <daniel.henry.mantilla@gmail.com>"]
edition = "2024"

description = "macro that expands to the name of the annotated function"
documentation = "https://docs.rs/method_name"
homepage = "https://crates.io/crates/method_name"
repository = "https://github.com/ssrlive/method_name"
keywords = [
    "macro",
    "proc-macro",
    "proc-macro-attribute",
    "name",
    "method_name",
]

readme = "README.md"
license = "MIT"

[package.metadata.docs.rs]
features = ["std", "docs-rs", "unstable"]

[workspace]
members = ["proc-macro"]

[features]
default = ["std"]
# default = ["std", "docs-rs", "unstable"]
std = ["dep:method_name_proc_macro"]
docs-rs = ["better-docs"]
better-docs = []
unstable = []

[dependencies.method_name_proc_macro]
version = "0.3.3"   # Keep in sync
path = "proc-macro"
optional = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[[example]]
name = "readme-basic"
path = "examples/readme-basic.rs"
required-features = ["std"]

[[example]]
name = "readme-function_path"
path = "examples/readme-function_path.rs"
required-features = ["std"]
